<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — Grade Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16.667 3.333H3.333A1.667 1.667 0 0 0 1.667 5v10A1.667 1.667 0 0 0 3.333 16.667h13.334A1.667 1.667 0 0 0 18.333 15V5a1.667 1.667 0 0 0-1.666-1.667Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M5 7.5h6.667M5 10h10M5 12.5h8.333" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span class="brand-name">Ledger</span>
    </div>
    <div class="gpa-pill" id="gpaStamp">
      <span class="gpa-label">GPA</span>
      <span class="gpa-value" id="gpaValue">—</span>
      <span class="gpa-scale" id="gpaScaleLabel">4.0 scale</span>
    </div>
  </div>
</header>

<main class="page">

  <section class="panel">
    <div class="panel-head">
      <h2>Settings</h2>
      <p>Configure how grades are scored across your classes.</p>
    </div>
    <div class="settings-card">
      <label class="field-label">
        Grading scale
        <select id="scaleSelect">
          <option value="4.0">4.0 GPA</option>
          <option value="5.0">5.0 GPA (weighted for Honors/AP)</option>
          <option value="percent">Percentage only</option>
        </select>
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="showLetters" checked />
        <span>Show letter grades</span>
      </label>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Classes</h2>
      <p>Add a class, set its categories and weights, then log assignments.</p>
    </div>

    <button class="btn btn-primary" id="addClassBtn">
      <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      Add a class
    </button>

    <div id="classList" class="class-list"></div>
  </section>

</main>

<template id="classCardTemplate">
  <article class="class-card">
    <div class="class-card-top">
      <div class="class-main">
        <div class="class-title-row">
          <input class="class-name-input" placeholder="Class name (e.g. AP Chemistry)" />
          <label class="honors-toggle">
            <input type="checkbox" class="honors-check" />
            <span>AP / Honors</span>
          </label>
          <button class="icon-btn delete-class-btn" title="Delete class">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="grade-badge">
        <span class="grade-letter">—</span>
        <span class="grade-percent"></span>
      </div>
    </div>

    <div class="categories-section">
      <div class="section-label-row">
        <span class="section-label">Categories &amp; weights</span>
        <button class="btn btn-small add-category-btn">+ Category</button>
      </div>
      <div class="category-list"></div>
      <p class="weight-warning" hidden></p>
    </div>

    <div class="card-footer">
      <button class="btn btn-ghost whatif-toggle-btn">
        <svg class="chevron" width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg>
        What-if calculator
      </button>
    </div>

    <div class="whatif-panel" hidden>
      <p class="whatif-help">Add a hypothetical assignment to see how it would change your grade. It won't be saved.</p>
      <div class="whatif-controls">
        <select class="whatif-category"></select>
        <input type="number" class="whatif-score" placeholder="Score" />
        <span class="whatif-slash">/</span>
        <input type="number" class="whatif-max" placeholder="Max" value="100" />
        <button class="btn btn-small whatif-run-btn">Calculate</button>
      </div>
      <p class="whatif-result"></p>
    </div>
  </article>
</template>

<template id="categoryTemplate">
  <div class="category-row">
    <div class="category-row-top">
      <input class="category-name-input" placeholder="Category (e.g. Tests)" />
      <div class="category-row-controls">
        <div class="weight-input-wrap">
          <input type="number" class="category-weight-input" placeholder="0" min="0" max="100" />
          <span class="weight-unit">%</span>
        </div>
        <button class="btn btn-small add-assignment-btn">+ Assignment</button>
        <button class="icon-btn delete-category-btn" title="Delete category">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="assignment-list"></div>
  </div>
</template>

<template id="assignmentTemplate">
  <div class="assignment-row">
    <input class="assignment-name-input" placeholder="Assignment name" />
    <div class="assignment-score-group">
      <input type="number" class="assignment-score-input" placeholder="Score" />
      <span class="slash">/</span>
      <input type="number" class="assignment-max-input" placeholder="Max" value="100" />
    </div>
    <button class="icon-btn delete-assignment-btn" title="Remove">
      <svg width="12" height="12" viewBox="0 0 14 14" fill="none"><path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/></svg>
    </button>
  </div>
</template>

<footer class="site-footer">
  <p>Grades are stored only in this browser — nothing is sent anywhere.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
